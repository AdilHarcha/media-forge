name: media-forge

x-app: &app
  build: .
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://forge:${POSTGRES_PASSWORD}@postgres:5432/forge
    S3_ENDPOINT: http://garage:3900
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_BUCKET: media
    API_KEY: ${API_KEY}
    API_KEYS: ${API_KEYS:-}
    DL_SECRET: ${DL_SECRET:-}
    PUBLIC_URL: ${PUBLIC_URL:-}
    RETENTION_DAYS: ${RETENTION_DAYS:-7}
    FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  depends_on:
    postgres: { condition: service_healthy }
    garage: { condition: service_started }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: forge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      retries: 10

  # Stockage S3 souverain (Garage, Deuxfleurs). Initialisation : ./scripts/init-storage.sh
  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  api:
    <<: *app
    command: ["node", "src/api.js"]
    ports:
      - "127.0.0.1:3100:3000"

  worker:
    <<: *app
    command: ["node", "src/worker.js"]
    # Limites strictes : le transcodage ne doit jamais saturer l'hôte
    cpus: 2
    cpu_shares: 256     # priorité basse face aux autres services de l'hôte
    mem_limit: 2g
    pids_limit: 512
    deploy:
      replicas: 1   # augmenter / ajouter des nodes : tous piochent dans la même file Postgres

volumes:
  pgdata:
  garage-meta:
  garage-data:
